<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mineverse PRO</title>
  <style>
    :root {
      --primary: #007aff;
      --bg-light: #f4f5f7;
      --panel: rgba(255,255,255,0.75);
      --text-dark: #1c1c1e;
      --text-light: #ffffff;
      --shadow: 0 8px 32px rgba(0,0,0,0.1);
    }

    [data-theme="dark"] {
      --bg-light: #1c1c1e;
      --panel: rgba(36,36,38,0.85);
      --text-dark: #fefefe;
      --text-light: #fff;
      --shadow: 0 8px 32px rgba(255,255,255,0.05);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: 0.3s ease background;
      overflow: hidden;
    }

    .panel {
      background: var(--panel);
      box-shadow: var(--shadow);
      border-radius: 25px;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      text-align: center;
      backdrop-filter: blur(15px);
      transition: 0.3s ease;
    }

    h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .btn {
      background: var(--primary);
      color: var(--text-light);
      border: none;
      border-radius: 14px;
      padding: 0.9rem 1.4rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,122,255,0.3);
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .btn:active { transform: scale(0.96); }

    input {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      margin-top: 0.5rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      transition: border 0.2s ease;
    }
    input:focus {
      border: 1px solid var(--primary);
    }

    .hidden { display: none; }

    .coin {
      font-size: 2.4rem;
      color: var(--primary);
      margin: 0.6rem 0;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-dark);
      color: var(--text-light);
      padding: 0.8rem 1.4rem;
      border-radius: 12px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .toast.show { opacity: 1; }

    .avatar {
      font-size: 3rem;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .countdown {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: #777;
    }

    .boost {
      background: linear-gradient(90deg, #ffb347, #ffcc33);
      color: #1c1c1e;
      box-shadow: 0 4px 10px rgba(255,200,0,0.4);
    }
  </style>
</head>
<body>

  <!-- Giriş Ekranı -->
  <div class="panel" id="loginPanel">
    <div class="avatar">👨‍🚀</div>
    <h1>Mineverse'e Hoş Geldin</h1>
    <p>Macerana başlamak için ismini yaz:</p>
    <input id="usernameInput" type="text" placeholder="Kullanıcı adın" />
    <button class="btn" onclick="startGame()">🚀 Başla</button>
  </div>

  <!-- Oyun Paneli -->
  <div class="panel hidden" id="gamePanel">
    <h1 id="welcomeTitle">Hoş Geldin!</h1>
    <div class="coin" id="balance">0.0000 MV</div>
    <button id="mineBtn" class="btn">⛏️ Madenciliği Başlat</button>
    <p class="countdown" id="cooldownText"></p>
    <button class="btn boost" onclick="activateBoost()">⚡ Boost Aktif Et</button>
    <button class="btn" onclick="buyUpgrade()">💎 Telegram Yükseltme</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Element referansları
    const loginPanel = document.getElementById('loginPanel');
    const gamePanel = document.getElementById('gamePanel');
    const usernameInput = document.getElementById('usernameInput');
    const welcomeTitle = document.getElementById('welcomeTitle');
    const mineBtn = document.getElementById('mineBtn');
    const balanceEl = document.getElementById('balance');
    const cooldownText = document.getElementById('cooldownText');
    const toast = document.getElementById('toast');

    // Oyun değişkenleri
    let username = localStorage.getItem('username') || "";
    let balance = parseFloat(localStorage.getItem('balance')) || 0;
    let lastMineTime = parseInt(localStorage.getItem('lastMineTime')) || 0;
    let boostActive = false;
    let miningActive = false;

    const miningDuration = 15 * 1000; // 15 saniye
    const miningCooldown = 24 * 60 * 60 * 1000; // 24 saat

    // Tema otomatik (sistem teması)
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
    document.documentElement.dataset.theme = prefersDark.matches ? "dark" : "light";

    // Hoş geldin ekranı
    if (username) {
      showGamePanel();
    }

    function startGame() {
      const name = usernameInput.value.trim();
      if (!name) return showToast("İsim girmelisin!");
      username = name;
      localStorage.setItem('username', name);
      showToast(`Hoş geldin, ${name}! 🌟`);
      showGamePanel();
    }

    function showGamePanel() {
      loginPanel.classList.add('hidden');
      gamePanel.classList.remove('hidden');
      welcomeTitle.textContent = `👋 Hoş geldin ${username}`;
      updateBalanceDisplay();
      checkMiningCooldown();
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function updateBalanceDisplay() {
      balanceEl.textContent = balance.toFixed(4) + " MV";
    }

    function saveState() {
      localStorage.setItem('balance', balance);
      localStorage.setItem('lastMineTime', lastMineTime);
    }

    function startMining() {
      if (miningActive) return;
      const now = Date.now();
      if (now - lastMineTime < miningCooldown) {
        showToast("⏳ Henüz yeniden madencilik yapamazsın!");
        return;
      }
      miningActive = true;
      mineBtn.textContent = "⛏️ Kazım Devam Ediyor...";
      mineBtn.classList.add('disabled');

      const rewardPerSec = boostActive ? 0.0004 : 0.0002;
      const interval = setInterval(() => {
        balance += rewardPerSec;
        updateBalanceDisplay();
      }, 1000);

      setTimeout(() => {
        clearInterval(interval);
        miningActive = false;
        lastMineTime = Date.now();
        saveState();
        showToast("🔥 Kazım tamamlandı!");
        mineBtn.textContent = "✅ Madencilik Bitti";
        checkMiningCooldown();
      }, miningDuration);
    }

    function checkMiningCooldown() {
      const now = Date.now();
      const remaining = miningCooldown - (now - lastMineTime);
      if (remaining <= 0) {
        mineBtn.textContent = "⛏️ Madenciliği Başlat";
        mineBtn.classList.remove('disabled');
        cooldownText.textContent = "";
      } else {
        const hrs = Math.floor(remaining / 3600000);
        const mins = Math.floor((remaining % 3600000) / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        cooldownText.textContent = `⏱️ ${hrs} sa ${mins} dk ${secs} sn sonra tekrar madencilik yapabilirsin.`;
        mineBtn.classList.add('disabled');
        setTimeout(checkMiningCooldown, 1000);
      }
    }

    function activateBoost() {
      if (boostActive) return showToast("⚡ Boost zaten aktif!");
      boostActive = true;
      showToast("⚡ Boost modu aktif! 2x kazanç 30 saniye boyunca!");
      setTimeout(() => {
        boostActive = false;
        showToast("Boost süresi doldu ⏳");
      }, 30000);
    }

    function buyUpgrade() {
      showToast("💎 Telegram’a yönlendiriliyorsun...");
      setTimeout(() => window.open("https://t.me/mineverse_support", "_blank"), 1500);
    }

    mineBtn.addEventListener('click', startMining);
    setInterval(saveState, 5000);
  </script>

</body>
</html>
