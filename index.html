<!DOCTYPE html>
<html lang="tr" class=""> <!-- Karanlık mod için 'class' buraya eklenecek -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Görev Yöneticisi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- iOS Font Düzeltmesi -->
    <style>
        /* iOS'ta yatay moda geçince fontların devasa olmasını engeller */
        @-ms-viewport { width: device-width; }
        @-o-viewport { width: device-width; }
        @viewport { width: device-width; }
        body {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
            /* Mobil tarayıcılarda 'aşağı çekip yenileme' ve 'sıçrama' efektini kapatır */
            overscroll-behavior: none;
        }
        
        /* Tema Geçişi için yumuşak animasyon */
        body, .bg-white, .bg-gray-50, .bg-gray-100, .bg-gray-800, .bg-gray-900, .text-gray-900, .text-gray-100, input, textarea, select {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* Görev kaydırma stilleri */
        .task-item {
            position: relative;
            overflow: hidden;
            touch-action: pan-y; /* Dikey kaydırmayı etkin tutar */
        }
        .task-content {
            position: relative;
            z-index: 10;
            background: inherit; /* Arka planı üst elementten alır */
            transition: transform 0.3s ease-out;
            will-change: transform;
        }
        .swipe-action {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 80px; /* Kaydırma eylem alanı genişliği */
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1;
        }
        .swipe-action.left {
            right: 0;
            background-color: #ef4444; /* red-500 */
        }
        .swipe-action.right {
            left: 0;
            background-color: #22c55e; /* green-500 */
        }

        /* Yükleme animasyonu */
        .loader {
            border: 4px solid #f3f3f3; /* Light grey */
            border-top: 4px solid #3498db; /* Blue */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Proje Etiketi */
        .project-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem; /* 12px */
            font-weight: 500;
            margin-right: 8px;
        }

        /* Rapor için basit çubuk grafik */
        .bar-chart {
            display: flex;
            height: 100px;
            align-items: flex-end;
            gap: 8px;
            border-bottom: 1px solid #9ca3af; /* gray-400 */
        }
        .bar {
            flex-grow: 1;
            background-color: #3b82f6; /* blue-500 */
            transition: height 0.5s ease-out;
        }
        .dark .bar {
            background-color: #60a5fa; /* blue-400 */
        }

        /* Gelişmiş seçenekler panelinin açılıp kapanması */
        #advancedOptions {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        #advancedOptions.open {
            max-height: 500px; /* Açıkken alacağı maksimum yükseklik */
        }

        /* Alt görevlerin açılıp kapanması */
        .subtask-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 0;
        }
        .subtask-list.open {
            max-height: 500px;
            opacity: 1;
        }

        /* Toast Bildirim */
        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background-color: #1f2937; /* gray-800 */
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            opacity: 1;
            transform: translateX(0);
        }
        .toast.hide {
            opacity: 0;
            transform: translateX(100%);
        }
        .dark .toast {
            background-color: #f3f4f6; /* gray-100 */
            color: #1f2937; /* gray-800 */
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans antialiased overscroll-behavior-none">

    <!-- Toast Bildirim Konteyneri -->
    <div id="toastContainer"></div>

    <!-- Uygulama Konteyneri -->
    <!-- Ekranın tamamını kaplar ve alttaki menüye yer açmak için alttan padding alır -->
    <div class="flex flex-col h-screen max-w-lg mx-auto bg-white dark:bg-gray-800 shadow-lg">
        
        <!-- 1. Başlık (Header) -->
        <header class="p-4 bg-blue-600 text-white dark:bg-blue-800 flex justify-between items-center shadow-md z-20">
            <h1 class="text-2xl font-bold">Akıllı Asistan</h1>
            <div class="flex items-center space-x-2">
                <!-- Rapor Butonu -->
                <button id="reportButton" class="p-2 rounded-full hover:bg-blue-700 dark:hover:bg-blue-900 focus:outline-none focus:ring-2 focus:ring-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0h6m6 0v-6a2 2 0 00-2-2h-2a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2z" />
                    </svg>
                </button>
                <!-- Bugün Odaklan Butonu -->
                <button id="focusButton" class="p-2 rounded-full hover:bg-blue-700 dark:hover:bg-blue-900 focus:outline-none focus:ring-2 focus:ring-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m12.728 0l-.707.707M12 21v-1m-6.364-1.636l.707-.707" />
                    </svg>
                </button>
                <!-- Tema Değiştir Butonu -->
                <button id="themeToggle" class="p-2 rounded-full hover:bg-blue-700 dark:hover:bg-blue-900 focus:outline-none focus:ring-2 focus:ring-white">
                    <!-- Güneş (Açık Mod) İkonu -->
                    <svg id="themeIconSun" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M12 12a5 5 0 100-10 5 5 0 000 10z" />
                    </svg>
                    <!-- Ay (Karanlık Mod) İkonu -->
                    <svg id="themeIconMoon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- 2. Arama ve Filtreleme Alanı -->
        <div class="p-4 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 z-10">
            <!-- Arama Çubuğu -->
            <input id="searchBar" type="text" placeholder="Görev veya proje ara..." class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            
            <!-- Filtre Butonları -->
            <div class="flex justify-center space-x-2 mt-3">
                <button data-filter="all" class="filter-btn flex-1 px-3 py-1 text-sm rounded-md bg-blue-500 text-white dark:bg-blue-700 focus:outline-none">Tümü</button>
                <button data-filter="active" class="filter-btn flex-1 px-3 py-1 text-sm rounded-md bg-gray-200 text-gray-700 dark:bg-gray-600 dark:text-gray-200 focus:outline-none">Aktif</button>
                <button data-filter="completed" class="filter-btn flex-1 px-3 py-1 text-sm rounded-md bg-gray-200 text-gray-700 dark:bg-gray-600 dark:text-gray-200 focus:outline-none">Tamamlanan</button>
            </div>
        </div>

        <!-- 3. Görev Listesi (Esnek ve Kaydırılabilir Alan) -->
        <main id="taskList" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-100 dark:bg-gray-900">
            <!-- Görevler buraya JS ile eklenecek -->
        </main>

        <!-- 4. Görev Ekleme Menüsü (Footer) -->
        <footer class="p-4 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 shadow-inner z-20">
            <!-- Gelişmiş Seçenekler (Gizli Panel) -->
            <div id="advancedOptions" class="">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <!-- Tarih ve Saat Seçimi -->
                    <div>
                        <label for="taskDueDate" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Bitiş Tarihi</label>
                        <input type="datetime-local" id="taskDueDate" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-blue-500">
                    </div>
                    <!-- Öncelik Seçimi -->
                    <div>
                        <label for="taskPriority" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Öncelik</label>
                        <select id="taskPriority" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-blue-500">
                            <option value="low">Düşük</option>
                            <option value="medium" selected>Orta</option>
                            <option value="high">Yüksek</option>
                        </select>
                    </div>
                    <!-- Proje Girişi -->
                    <div>
                        <label for="taskProject" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Proje</label>
                        <div class="flex">
                            <input type="text" id="taskProject" placeholder="Örn: İş, Ev" class="mt-1 block w-full border border-gray-300 rounded-l-md shadow-sm p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-blue-500">
                            <!-- Akıllı Kategori Butonu -->
                            <button id="magicCategoryButton" class="mt-1 p-2 bg-indigo-500 text-white rounded-r-md hover:bg-indigo-600 focus:outline-none">
                                ✨
                            </button>
                        </div>
                    </div>
                    <!-- Tekrarlama Seçimi -->
                    <div>
                        <label for="taskRepeat" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Tekrarla</label>
                        <select id="taskRepeat" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-blue-500">
                            <option value="none" selected>Hiç</option>
                            <option value="daily">Günlük</option>
                            <option value="weekly">Haftalık</option>
                            <option value="monthly">Aylık</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Ana Ekleme Çubuğu -->
            <div class="flex space-x-2 items-start">
                <!-- Gelişmiş Seçenekleri Aç/Kapa Butonu -->
                <button id="toggleAdvancedButton" class="p-3 border rounded-lg dark:border-gray-600 dark:text-white hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                    </svg>
                </button>
                <input type="text" id="taskInput" placeholder="Yeni bir görev ekle..." class="flex-1 px-4 py-3 border border-gray-300 rounded-lg dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="addTaskButton" class="px-5 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800">
                    Ekle
                </button>
            </div>
        </footer>
    </div>

    <!-- 5. Modal Pencereler (Gizli) -->

    <!-- Görev Düzenleme Modalı -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-lg max-h-[85vh] flex flex-col">
            <!-- Modal Başlık -->
            <div class="p-4 border-b dark:border-gray-700">
                <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Görevi Düzenle</h3>
            </div>
            
            <!-- Modal İçerik (Kaydırılabilir) -->
            <div class="p-4 space-y-4 overflow-y-auto">
                <input type="hidden" id="editTaskId">
                <!-- Temel Görev Metni -->
                <div>
                    <label for="editTaskText" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Görev</label>
                    <input type="text" id="editTaskText" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600">
                </div>
                <!-- Görev Notları -->
                <div>
                    <label for="editTaskNotes" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Notlar</label>
                    <textarea id="editTaskNotes" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="Detaylar, linkler, telefon numaraları..."></textarea>
                </div>
                
                <!-- Gelişmiş Seçenekler -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="editTaskDueDate" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Bitiş Tarihi</label>
                        <input type="datetime-local" id="editTaskDueDate" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600">
                    </div>
                    <div>
                        <label for="editTaskPriority" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Öncelik</label>
                        <select id="editTaskPriority" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600">
                            <option value="low">Düşük</option>
                            <option value="medium">Orta</option>
                            <option value="high">Yüksek</option>
                        </select>
                    </div>
                    <div>
                        <label for="editTaskProject" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Proje</label>
                        <input type="text" id="editTaskProject" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600">
                    </div>
                    <div>
                        <label for="editTaskRepeat" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Tekrarla</label>
                        <select id="editTaskRepeat" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600">
                            <option value="none">Hiç</option>
                            <option value="daily">Günlük</option>
                            <option value="weekly">Haftalık</option>
                            <option value="monthly">Aylık</option>
                        </select>
                    </div>
                </div>

                <!-- Alt Görevler Bölümü -->
                <div>
                    <h4 class="text-md font-semibold text-gray-800 dark:text-gray-200 mb-2">Alt Görevler</h4>
                    <div id="editSubtaskList" class="space-y-2">
                        <!-- Alt görevler buraya eklenecek -->
                    </div>
                    <!-- Yeni Alt Görev Ekleme -->
                    <div class="flex space-x-2 mt-2">
                        <input type="text" id="newSubtaskInput" placeholder="Yeni alt görev" class="flex-1 border border-gray-300 rounded-md p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600">
                        <button id="addSubtaskButton" class="p-2 bg-green-500 text-white rounded-md hover:bg-green-600">Ekle</button>
                    </div>
                </div>
            </div>
            
            <!-- Modal Footer (Butonlar) -->
            <div class="p-4 bg-gray-50 dark:bg-gray-900 border-t dark:border-gray-700 flex justify-end space-x-3">
                <button id="cancelEditButton" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 dark:bg-gray-600 dark:text-gray-200 dark:hover:bg-gray-500">İptal</button>
                <button id="saveTaskButton" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Rapor Modalı -->
    <div id="reportModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-lg max-h-[85vh] flex flex-col">
            <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center">
                <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Haftalık Rapor</h3>
                <button id="closeReportButton" class="p-1 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            
            <div class="p-4 space-y-4 overflow-y-auto">
                <!-- İstatistikler -->
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="p-3 bg-green-100 dark:bg-green-900 rounded-lg">
                        <div id="reportCompleted" class="text-3xl font-bold text-green-700 dark:text-green-300">0</div>
                        <div class="text-sm text-green-600 dark:text-green-400">Görev Tamamlandı (7 Gün)</div>
                    </div>
                    <div class="p-3 bg-yellow-100 dark:bg-yellow-900 rounded-lg">
                        <div id="reportActive" class="text-3xl font-bold text-yellow-700 dark:text-yellow-300">0</div>
                        <div class="text-sm text-yellow-600 dark:text-yellow-400">Aktif Görev</div>
                    </div>
                </div>
                
                <!-- Proje Dağılımı -->
                <div>
                    <h4 class="text-md font-semibold text-gray-800 dark:text-gray-200 mb-2">Proje Dağılımı (Aktif Görevler)</h4>
                    <div id="reportProjectChart" class="bar-chart p-2 bg-gray-50 dark:bg-gray-900 rounded">
                        <!-- Çubuklar buraya eklenecek -->
                    </div>
                    <div id="reportProjectLegend" class="flex flex-wrap gap-2 mt-2">
                        <!-- Etiketler buraya eklenecek -->
                    </div>
                </div>

                <!-- Akıllı Yorum -->
                <div>
                    <h4 class="text-md font-semibold text-gray-800 dark:text-gray-200 mb-2">Akıllı Yorum</h4>
                    <p id="reportSummary" class="p-3 bg-blue-50 dark:bg-blue-900 text-blue-800 dark:text-blue-200 rounded-lg text-sm">
                        Rapor oluşturuluyor...
                    </p>
                </div>

                <!-- Veri Yedekleme -->
                <div>
                    <h4 class="text-md font-semibold text-gray-800 dark:text-gray-200 mb-2">Veri Yönetimi</h4>
                    <div class="flex space-x-2">
                        <button id="exportDataButton" class="flex-1 px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm">
                            Verileri Dışa Aktar (.json)
                        </button>
                        <label class_replacement="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 text-sm text-center cursor-pointer">
                            Verileri İçe Aktar
                            <input type="file" id="importDataInput" accept=".json" class="hidden">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- "Bugün Odaklan" Modalı -->
    <div id="focusModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-lg max-h-[85vh] flex flex-col">
            <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center">
                <h3 class="text-xl font-semibold text-gray-900 dark:text-white">🧠 Bugün Odaklan</h3>
                <button id="closeFocusButton" class="p-1 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            
            <div class="p-4 space-y-4 overflow-y-auto">
                <p id="focusSummary" class="p-3 bg-blue-50 dark:bg-blue-900 text-blue-800 dark:text-blue-200 rounded-lg text-sm">
                    Analiz ediliyor...
                </p>
                <ul id="focusTaskList" class="space-y-2">
                    <!-- Odaklanılacak görevler buraya eklenecek -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Firebase ve Uygulama Mantığı -->
    <script type="module">
        // Firebase kütüphanelerini import ediyoruz
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged, 
            signInWithCustomToken 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            collection, 
            query, 
            where, 
            getDocs,
            Timestamp,
            // enableNetwork, // DÜZELTME: Bu modülde bulunmuyor
            // disableNetwork, // DÜZELTME: Bu modülde bulunmuyor
            enableIndexedDbPersistence, // DÜZELTME: 'enablePersistence' yerine bu kullanılır
            writeBatch
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Canvas ortamı tarafından sağlanan konfigürasyon

        // --- Yardımcı Fonksiyonlar ---

        /**
         * Tarihi 'YYYY-AA-GGTHH:SS' formatına dönüştürür (datetime-local input için).
         * @param {Date | Timestamp} date - Tarih nesnesi veya Firestore Timestamp.
         * @returns {string} Formatlanmış tarih string'i.
         */
        function formatDateTimeLocal(date) {
            if (!date) return '';
            if (date.toDate) date = date.toDate(); // Timestamp ise Date'e çevir
            
            const pad = (num) => num.toString().padStart(2, '0');
            const year = date.getFullYear();
            const month = pad(date.getMonth() + 1);
            const day = pad(date.getDate());
            const hours = pad(date.getHours());
            const minutes = pad(date.getMinutes());
            
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        /**
         * Tarihi 'GG Ay YYYY, HH:SS' formatında güzel bir string'e dönüştürür.
         * @param {Timestamp} timestamp - Firestore Timestamp.
         * @returns {string} Formatlanmış tarih.
         */
        function formatReadableDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate();
            return date.toLocaleString('tr-TR', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        /**
         * Tarihin bugün mü, geçmişte mi olduğunu kontrol eder.
         * @param {Timestamp} timestamp - Firestore Timestamp.
         * @returns {'overdue' | 'today' | 'future'} Tarih durumu.
         */
        function checkDateStatus(timestamp) {
            if (!timestamp) return null;
            const now = new Date();
            const taskDate = timestamp.toDate();

            const isSameDay = (d1, d2) => 
                d1.getFullYear() === d2.getFullYear() &&
                d1.getMonth() === d2.getMonth() &&
                d1.getDate() === d2.getDate();

            if (taskDate < now && !isSameDay(now, taskDate)) {
                return 'overdue';
            } else if (isSameDay(now, taskDate)) {
                return 'today';
            }
            return 'future';
        }

        /**
         * Ekranın köşesinde bir bildirim (toast) gösterir.
         * @param {string} message - Gösterilecek mesaj.
         * @param {number} duration - Milisaniye cinsinden süre.
         */
        function showToast(message, duration = 3000) {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            toastContainer.appendChild(toast);

            // Gösterme animasyonu (CSS'te varsayılan)
            
            // Gizleme zamanlayıcısı
            setTimeout(() => {
                toast.classList.add('hide');
                // Animasyon bittikten sonra DOM'dan kaldır
                toast.addEventListener('transitionend', () => {
                    // Güvenlik kontrolü, belki zaten kaldırılmıştır
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, { once: true }); // Olayı sadece bir kez dinle
            }, duration);
        }

        /**
         * Firestore'dan görevleri dinler ve değişiklik olduğunda 'allTasks' dizisini günceller.
         */
        function listenForTasks() {
            if (!userId) return;

            // Zaten bir dinleyici varsa, önce onu durdur
            if (tasksListener) {
                tasksListener(); 
            }

            tasksCollection = collection(db, `artifacts/${appId}/users/${userId}/tasks`);
            
            // Görevleri createdAt'a (oluşturulma tarihi) göre azalan sırada (en yeni üstte)
            // getirmek isterdik, ancak bu, Firebase'de özel bir indeks gerektirir.
            // Bu yüzden tüm veriyi çekip istemci tarafında (client-side) sıralayacağız.
            const q = query(tasksCollection);

            tasksListener = onSnapshot(q, (snapshot) => {
                allTasks = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                // Akıllı kategori için hafızayı eğit
                trainCategoryLearner(allTasks);

                // Görevleri ekrana çiz
                renderTasks();
            }, (error) => {
                console.error("Görevleri dinlerken hata:", error);
            });
        }

        /**
         * Yeni bir görevi Firestore'a ekler.
         */
        async function addTaskToDb() {
            const text = taskInput.value.trim();
            if (text === '') return;

            // Gelişmiş seçenekleri al
            const dueDateValue = taskDueDate.value ? Timestamp.fromDate(new Date(taskDueDate.value)) : null;
            const priorityValue = taskPriority.value;
            const projectValue = taskProject.value.trim();
            const repeatValue = taskRepeat.value;

            try {
                await addDoc(tasksCollection, {
                    text: text,
                    completed: false,
                    createdAt: Timestamp.now(),
                    dueDate: dueDateValue,
                    priority: priorityValue,
                    project: projectValue,
                    repeat: repeatValue,
                    notes: "", // Başlangıçta notlar boş
                    subtasks: [] // Başlangıçta alt görevler boş
                });

                // Giriş alanlarını temizle (gelişmiş panel açık kalsa bile)
                taskInput.value = '';
                taskDueDate.value = '';
                taskPriority.value = 'medium';
                taskProject.value = '';
                taskRepeat.value = 'none';
                
                // Görevi ekledikten sonra paneli kapat
                if(advancedOptions.classList.contains('open')) {
                    toggleAdvancedOptions();
                }

                showToast("Görev eklendi!");
            } catch (error) {
                console.error("Görev eklenirken hata:", error);
                showToast("Hata: Görev eklenemedi.", 3000);
            }
        }

        /**
         * Bir görevin 'completed' (tamamlanma) durumunu değiştirir.
         * @param {string} id - Görev ID'si.
         * @param {boolean} currentStatus - Görevin mevcut tamamlanma durumu.
         */
        async function toggleTaskCompleted(id, currentStatus) {
            const task = allTasks.find(t => t.id === id);
            if (!task) return;

            // Tekrarlayan görev mantığı
            if (!currentStatus && task.repeat !== 'none') {
                const newDueDate = getNextRepeatDate(task.dueDate, task.repeat);
                try {
                    const taskRef = doc(db, `artifacts/${appId}/users/${userId}/tasks`, id);
                    await updateDoc(taskRef, {
                        // Tekrarlayan görevse, tamamlandı olarak işaretleme, sadece tarihini güncelle.
                        // Eğer alt görevleri varsa, onları sıfırla.
                        dueDate: newDueDate,
                        subtasks: task.subtasks.map(sub => ({ ...sub, completed: false }))
                    });
                    showToast(`Görev ${task.repeat} olarak yinelendi!`);
                } catch (error) {
                    console.error("Tekrarlayan görev güncellenirken hata:", error);
                }
            } else {
                // Normal görev veya tamamlanmamışa geri döndürme
                try {
                    const taskRef = doc(db, `artifacts/${appId}/users/${userId}/tasks`, id);
                    await updateDoc(taskRef, {
                        completed: !currentStatus
                    });
                } catch (error) {
                    console.error("Görev durumu güncellenirken hata:", error);
                }
            }
        }

        // --- Görevleri Ekrana Çizme (Render) ---

        /**
         * 'allTasks' dizisini filtreler, sıralar ve ekrana çizer.
         */
        function renderTasks() {
            // 1. Filtrele (Arama ve Butonlar)
            const searchTerm = searchBar.value.toLowerCase();
            
            const filteredTasks = allTasks.filter(task => {
                // Filtre butonuna göre filtrele
                const filterMatch = 
                    (currentFilter === 'all') ||
                    (currentFilter === 'active' && !task.completed) ||
                    (currentFilter === 'completed' && task.completed);
                
                if (!filterMatch) return false;

                // Arama terimine göre filtrele (Görev metni, proje veya notlar)
                const searchMatch = 
                    task.text.toLowerCase().includes(searchTerm) ||
                    (task.project && task.project.toLowerCase().includes(searchTerm)) ||
                    (task.notes && task.notes.toLowerCase().includes(searchTerm));
                
                return searchMatch;
            });

            // 2. Sırala
            // Sıralama mantığı:
            // 1. Tamamlanmamışlar üste
            // 2. Bitiş tarihi olanlar (en yakın tarihli olanlar üste)
            // 3. Önceliği yüksek olanlar üste
            // 4. Oluşturulma tarihi (en yeni üste)
            const sortedTasks = filteredTasks.sort((a, b) => {
                // Tamamlanma durumu
                if (a.completed !== b.completed) {
                    return a.completed ? 1 : -1;
                }
                // Bitiş tarihi (Null olanlar sona)
                if (a.dueDate && b.dueDate) {
                    if (a.dueDate.seconds !== b.dueDate.seconds) {
                        return a.dueDate.seconds - b.dueDate.seconds; // Yakın tarih üste
                    }
                } else if (a.dueDate) {
                    return -1; // Sadece a'nın tarihi var, a üste
                } else if (b.dueDate) {
                    return 1; // Sadece b'nin tarihi var, b üste
                }
                // Öncelik (high=2, medium=1, low=0)
                const priorityMap = { high: 2, medium: 1, low: 0 };
                const priorityA = priorityMap[a.priority] || 1;
                const priorityB = priorityMap[b.priority] || 1;
                if (priorityA !== priorityB) {
                    return priorityB - priorityA; // Yüksek öncelik üste
                }
                // Oluşturulma tarihi (En yeni üste)
                return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
            });

            // 3. Ekrana Çiz
            taskList.innerHTML = ''; // Listeyi temizle
            if (sortedTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="text-center text-gray-500 dark:text-gray-400 mt-10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        Tebrikler, hiç göreviniz yok!
                    </div>`;
                return;
            }

            sortedTasks.forEach(task => {
                const taskElement = createTaskElement(task);
                taskList.appendChild(taskElement);
            });
        }

        /**
         * Tek bir görev verisinden HTML elementi oluşturur.
         * @param {object} task - Görev nesnesi.
         * @returns {HTMLElement} Oluşturulan div elementi.
         */
        function createTaskElement(task) {
            const div = document.createElement('div');
            div.className = 'task-item'; // Kaydırma için
            
            // Tarih durumuna göre arka plan rengi
            const dateStatus = checkDateStatus(task.dueDate);
            const bgColor = task.completed ? 'bg-gray-200 dark:bg-gray-700' : (dateColors[dateStatus] || dateColors.default);
            // Öncelik rengi (sol kenar)
            const borderColor = priorityColors[task.priority] || 'border-transparent';

            // Alt görev ilerlemesi
            const totalSubtasks = task.subtasks?.length || 0;
            const completedSubtasks = task.subtasks?.filter(s => s.completed).length || 0;
            const progressText = totalSubtasks > 0 ? `[${completedSubtasks}/${totalSubtasks}]` : '';

            // Görevin kendisi (kaydırılabilir içerik)
            const contentDiv = document.createElement('div');
            contentDiv.className = `task-content relative flex items-center p-3 rounded-lg shadow ${bgColor} border-l-4 ${borderColor}`;
            
            // 1. Checkbox
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = task.completed;
            checkbox.className = 'h-6 w-6 rounded text-blue-500 border-gray-300 dark:border-gray-600 focus:ring-blue-500 mr-3 flex-shrink-0';
            checkbox.addEventListener('change', () => toggleTaskCompleted(task.id, task.completed));
            
            // 2. Görev Metni ve Detayları
            const textContainer = document.createElement('div');
            textContainer.className = 'flex-1 min-w-0'; // Taşan metinler için
            
            // Görev Metni (Tıklanabilir - Alt görevleri açar/kapar)
            const textSpan = document.createElement('span');
            textSpan.textContent = task.text;
            textSpan.className = `text-gray-900 dark:text-white ${task.completed ? 'line-through text-gray-500 dark:text-gray-400' : ''} ${totalSubtasks > 0 ? 'cursor-pointer font-medium' : ''}`;
            if (totalSubtasks > 0) {
                textSpan.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const sublist = div.querySelector('.subtask-list');
                    if (sublist) {
                        sublist.classList.toggle('open');
                    }
                });
            }
            
            // Alt Başlık (Tarih, Proje, Not ikonu, Alt görev ilerlemesi)
            const detailsContainer = document.createElement('div');
            detailsContainer.className = 'text-sm text-gray-500 dark:text-gray-400 flex items-center flex-wrap gap-x-2';
            
            if (task.dueDate) {
                const dateSpan = document.createElement('span');
                dateSpan.textContent = formatReadableDate(task.dueDate);
                if (dateStatus === 'overdue' && !task.completed) {
                    dateSpan.className = 'font-bold text-red-600 dark:text-red-400';
                }
                detailsContainer.appendChild(dateSpan);
            }
            if (task.project) {
                const projectBadge = document.createElement('span');
                projectBadge.className = 'project-badge bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200';
                projectBadge.textContent = task.project;
                detailsContainer.appendChild(projectBadge);
            }
            if (progressText) {
                const progressSpan = document.createElement('span');
                progressSpan.className = 'font-mono text-xs font-bold text-gray-600 dark:text-gray-300';
                progressSpan.textContent = progressText;
                detailsContainer.appendChild(progressSpan);
            }
            if (task.notes) {
                const noteIcon = document.createElement('span');
                noteIcon.textContent = '📝';
                noteIcon.className = 'cursor-pointer';
                noteIcon.title = task.notes; // Hover'da göster
                noteIcon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showToast(`Not: ${task.notes}`, 5000);
                });
                detailsContainer.appendChild(noteIcon);
            }

            textContainer.appendChild(textSpan);
            textContainer.appendChild(detailsContainer);

            // 3. Düzenle Butonu (...)
            const editButton = document.createElement('button');
            editButton.className = 'ml-2 p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 flex-shrink-0';
            editButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" /></svg>';
            editButton.addEventListener('click', () => openEditModal(task));

            contentDiv.appendChild(checkbox);
            contentDiv.appendChild(textContainer);
            contentDiv.appendChild(editButton);

            // Alt görev listesi (Gizli)
            let subtaskList = null;
            if (totalSubtasks > 0) {
                subtaskList = document.createElement('div');
                subtaskList.className = 'subtask-list pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-800 rounded-b-lg';
                
                task.subtasks.forEach((subtask, index) => {
                    const subDiv = document.createElement('div');
                    subDiv.className = 'flex items-center space-x-2';
                    
                    const subCheckbox = document.createElement('input');
                    subCheckbox.type = 'checkbox';
                    subCheckbox.checked = subtask.completed;
                    subCheckbox.className = 'h-4 w-4 rounded text-blue-500 border-gray-300 dark:border-gray-600 focus:ring-blue-500';
                    subCheckbox.addEventListener('change', () => toggleSubtask(task.id, index));
                    
                    const subText = document.createElement('span');
                    subText.textContent = subtask.text;
                    subText.className = `text-sm text-gray-700 dark:text-gray-300 ${subtask.completed ? 'line-through text-gray-500' : ''}`;
                    
                    subDiv.appendChild(subCheckbox);
                    subDiv.appendChild(subText);
                    subtaskList.appendChild(subDiv);
                });
            }

            // Kaydırma Eylem (Swipe) Alanları (Gizli)

            editModal.classList.add('hidden');

            editTaskText.value = '';
            editTaskNotes.value = '';

        async function saveTaskChanges() {
            const id = editTaskId.value;
            if (!id) return;

            const updatedTask = {
                text: editTaskText.value.trim(),
                notes: editTaskNotes.value.trim(),
                dueDate: editTaskDueDate.value ? Timestamp.fromDate(new Date(editTaskDueDate.value)) : null,
                priority: editTaskPriority.value,
                project: editTaskProject.value.trim(),
                repeat: editTaskRepeat.value,
                // Alt görevler 'subtasks' global değişkeninden (veya DOM'dan) alınmalı
                subtasks: getSubtasksFromModal()
            };

            if (updatedTask.text === '') {
                showToast("Görev metni boş olamaz!", 3000);
                return;
            }

            try {
                const taskRef = doc(db, `artifacts/${appId}/users/${userId}/tasks`, id);
                await updateDoc(taskRef, updatedTask);
                showToast("Görev güncellendi.");
                closeEditModal();
            } catch (error) {
                console.error("Görev güncellenirken hata:", error);
                showToast("Hata: Görev güncellenemedi.");
            }
        }

        /**

         */
        function getSubtasksFromModal() {
            const subtaskElements = editSubtaskList.querySelectorAll('.flex');
            const subtasks = [];

                const textInput = el.querySelector('.subtask-modal-text');
                const checkbox = el.querySelector('.subtask-modal-checkbox');
                if (textInput && checkbox) {
                    subtasks.push({

        /**
         * Ana listedeki alt görev checkbox'ını işler.
         */
        async function toggleSubtask(taskId, subtaskIndex) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;

            // Kopyasını oluştur ve güncelle
            const newSubtasks = [...task.subtasks];
            newSubtasks[subtaskIndex].completed = !newSubtasks[subtaskIndex].completed;

            // Ana görevin tamamlanma durumunu kontrol et
            // Tüm alt görevler tamamlandıysa, ana görevi de tamamla
            const allSubtasksCompleted = newSubtasks.every(s => s.completed);
            
            try {
                const taskRef = doc(db, `artifacts/${appId}/users/${userId}/tasks`, taskId);
                await updateDoc(taskRef, {
                    subtasks: newSubtasks,
                    completed: allSubtasksCompleted // Ana görevi de güncelle
                });
                
                if (allSubtasksCompleted && task.repeat !== 'none') {
                    // Eğer tüm alt görevler tamamlandıysa ve bu tekrarlayan bir görevse,
                    // görevi yenile (toggleTaskCompleted mantığını taklit et)
                    await toggleTaskCompleted(taskId, false); // false yolluyoruz ki yenileme tetiklensin
                }
                
            } catch (error) {
                console.error("Alt görev güncellenirken hata:", error);
            }
        }


        // --- "Akıllı" Özellikler (Yerel) ---

        /**
         * Görev listesinden kelime ve proje eşleşmelerini öğrenir.
         */
        function trainCategoryLearner(tasks) {
            learnedCategories = {}; // Hafızayı sıfırla
            tasks.forEach(task => {
                if (task.project) {
                    const words = task.text.toLowerCase().split(/\s+/); // Kelimelere ayır
                    words.forEach(word => {
                        if (word.length > 3) { // Çok kısa kelimeleri (ve, bir vb.) es geç
                            if (!learnedCategories[word]) {
                                learnedCategories[word] = {};
                            }
                            // Bu kelimenin bu projede kaç kez geçtiğini say
                            const count = (learnedCategories[word][task.project] || 0) + 1;
                            learnedCategories[word][task.project] = count;
                        }
                    });
                }
            });
        }

        /**
         * ✨ Butonu: Girilen göreve göre proje önerir.
         */
        function suggestCategory() {
            const text = taskInput.value.toLowerCase();
            const words = text.split(/\s+/);
            const suggestions = {};

            words.forEach(word => {
                if (learnedCategories[word]) {
                    Object.keys(learnedCategories[word]).forEach(project => {
                        const score = learnedCategories[word][project];
                        suggestions[project] = (suggestions[project] || 0) + score;
                    });
                }
            });

            // En yüksek skorlu projeyi bul
            let bestProject = '';
            let maxScore = 0;
            Object.keys(suggestions).forEach(project => {
                if (suggestions[project] > maxScore) {
                    maxScore = suggestions[project];
                    bestProject = project;
                }
            });

            if (bestProject) {
                taskProject.value = bestProject;
                showToast(`Proje önerildi: ${bestProject}`);
            } else {
                showToast("Uygun bir proje önerisi bulunamadı.");
            }
        }

        /**
         * 🧠 Butonu: Odaklanma modalını açar ve yerel olarak analiz yapar.
         */
        function showFocusModal() {
            const activeTasks = allTasks.filter(t => !t.completed);
            
            if (activeTasks.length === 0) {
                focusSummary.textContent = "Harika! Hiç aktif göreviniz yok. Rahatlayabilirsiniz.";
                focusTaskList.innerHTML = '';
                focusModal.classList.remove('hidden');
                return;
            }

            const now = new Date();
            const priorityMap = { high: 3, medium: 2, low: 1 };

            const scoredTasks = activeTasks.map(task => {
                let score = 0;
                // Öncelik puanı
                score += priorityMap[task.priority] || 2;
                
                // Tarih puanı
                if (task.dueDate) {
                    const taskDate = task.dueDate.toDate();
                    const diffDays = (taskDate - now) / (1000 * 60 * 60 * 24);

                    if (diffDays < -1) { // 1 günden fazla gecikmiş
                        score += 100;
                    } else if (diffDays < 0) { // Bugün veya dün gecikmiş
                        score += 50;
                    } else if (diffDays < 1) { // Bugün son günü
                        score += 25;
                    } else if (diffDays < 3) { // 3 gün içinde
                        score += 10;
                    }
                }
                
                // Alt görevi olmayanlar (daha hızlı bitirilebilir)
                if (!task.subtasks || task.subtasks.length === 0) {
                    score += 5;
                }
                
                return { ...task, score };
            });

            // En yüksek puanlı 5 görevi al
            const focusList = scoredTasks.sort((a, b) => b.score - a.score).slice(0, 5);

            // Akıllı özeti oluştur
            const overdueCount = focusList.filter(t => t.dueDate && t.dueDate.toDate() < now).length;
            let summaryText = `Şu anda ${activeTasks.length} aktif göreviniz var. `;
            if (overdueCount > 0) {
                summaryText += `Bunlardan ${overdueCount} tanesinin tarihi geçmiş görünüyor. `;
                summaryText += "En iyisi bunlara öncelik vererek başlayalım!";
            } else if (focusList.length > 0) {
                summaryText += `İşte başlamak için en mantıklı ${focusList.length} görev:`;
            } else {
                summaryText += "Görünüşe göre her şey kontrol altında!";
            }
            focusSummary.textContent = summaryText;

            // Odak listesini modal'a çiz
            focusTaskList.innerHTML = '';
            focusList.forEach(task => {
                // Görev elementini klonla (basitleştirilmiş versiyon)
                const taskDiv = document.createElement('div');
                taskDiv.className = 'flex items-center p-2 bg-gray-50 dark:bg-gray-700 rounded-lg';
                
                const taskText = document.createElement('span');
                taskText.className = 'flex-1 text-gray-900 dark:text-white';
                taskText.textContent = task.text;
                
                if (task.project) {
                    const projectBadge = document.createElement('span');
                    projectBadge.className = 'ml-2 project-badge bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200';
                    projectBadge.textContent = task.project;
                    taskText.appendChild(projectBadge);
                }
                
                taskDiv.appendChild(taskText);
                focusTaskList.appendChild(taskDiv);
            });

            focusModal.classList.remove('hidden');
        }

        /**
         * 📊 Butonu: Rapor modalını açar ve istatistikleri çizer.
         */
        function showReportModal() {
            const activeTasks = allTasks.filter(t => !t.completed);
            const now = new Date();
            const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

            ).length;

        // --- Tekrarlayan Görev Mantığı ---

        /**
         * Bir sonraki tekrarlama tarihini hesaplar.
         * @param {Timestamp} currentDueDate - Mevcut bitiş tarihi.
         * @param {'daily' | 'weekly' | 'monthly'} repeatType - Tekrarlama tipi.
         * @returns {Timestamp} Yeni bitiş tarihi.
         */
        function getNextRepeatDate(currentDueDate, repeatType) {
            // Eğer bir bitiş tarihi yoksa, bugünden itibaren hesapla
            const baseDate = currentDueDate ? currentDueDate.toDate() : new Date();
            // Tarihin mevcut saatini koru
            const newDate = new Date(baseDate.getTime());

            // Her zaman "bugünden sonraya" ayarla
            const now = new Date();
            if (newDate < now) {
                newDate = new Date();
                // Orijinal saati koru
                newDate.setHours(baseDate.getHours());
                newDate.setMinutes(baseDate.getMinutes());
            }

            switch (repeatType) {
                case 'daily':
                    newDate.setDate(newDate.getDate() + 1);
                    break;
                case 'weekly':
                    newDate.setDate(newDate.getDate() + 7);
                    break;
                case 'monthly':
                    newDate.setMonth(newDate.getMonth() + 1);
                    break;
                default:
                    return Timestamp.fromDate(newDate); // Değişiklik yapma
            }
            return Timestamp.fromDate(newDate);
        }

        // --- Alarm ve Bildirim Mantığı ---

        /**
         * Görevleri periyodik olarak kontrol eder ve bildirim gönderir.
         */
        function startNotificationTimer() {
            if (notificationTimer) {
                clearInterval(notificationTimer);
            }
            // Her 15 saniyede bir kontrol et
            notificationTimer = setInterval(checkTaskAlarms, 15000);
        }

        function checkTaskAlarms() {
            const now = new Date().getTime();
            const fiveMinutesInMs = 5 * 60 * 1000;

            allTasks.forEach(task => {
                if (!task.completed && task.dueDate) {
                    const taskTime = task.dueDate.toDate().getTime();
                    const diff = taskTime - now;

                    // 0 ile 5 dakika arasında mı VE daha önce bildirilmedi mi?
                    if (diff > 0 && diff <= fiveMinutesInMs) {
                        // Basit bir "bildirildi" bayrağı için localStorage kullanıyoruz
                        // (Sayfa yenilense bile hatırlamak için)
                        let notified = false;
                        try {
                            notified = localStorage.getItem(`notified_${task.id}`);
                        } catch (e) {}

                        if (!notified) {
                            sendNotification(task);
                            try {
                                localStorage.setItem(`notified_${task.id}`, 'true');
                            } catch (e) {}
                        }
                    }
                }
            });
        }

        /**
         * Tarayıcıya bildirim gönderir.
         */
        function sendNotification(task) {
            const title = 'Görev Yaklaşıyor!';
            const options = {
                body: `5 dakika kaldı: ${task.text}`,
                icon: './favicon.ico' // Buraya bir ikon URL'si eklenebilir
            };

            if ('Notification' in window) {
                if (Notification.permission === 'granted') {
                    new Notification(title, options);
                } else if (Notification.permission !== 'denied') {
                    // İzin zaten reddedilmediyse, tekrar iste
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            new Notification(title, options);
                        }
                    });
                }
            } else {
                // Tarayıcı Bildirimleri desteklemiyorsa, toast göster
                showToast(options.body, 5000);
            }
        }

        /**
         * Sayfa yüklendiğinde bildirim izni ister.
         */
        function requestNotificationPermission() {
            if ('Notification' in window) {
                if (Notification.permission === 'default') {
                    // Sadece 'default' ise (ne evet ne hayır) sor
                    Notification.requestPermission();
                }
            }
        }

        // --- Kaydırma (Swipe) Hareketleri Mantığı ---

        function setupSwipeActions(taskElement, contentElement, task) {
            let startX = 0;
            let currentX = 0;
            let isSwiping = false;
            const threshold = 80; // Kaydırmayı tetiklemek için gereken minimum piksel

            function onTouchStart(e) {
                // Sadece tek parmakla dokunmayı algıla
                if (e.touches.length !== 1) return;
                startX = e.touches[0].clientX;
                currentX = startX;
                isSwiping = true;
                // Kaydırma başlarken animasyonu kaldır
                contentElement.style.transition = 'none';
            }

            function onTouchMove(e) {
                if (!isSwiping || e.touches.length !== 1) return;
                
                currentX = e.touches[0].clientX;
                let diffX = currentX - startX;

                // Sadece yatay kaydırmaya izin ver
                // (Dikey kaydırma (scroll) ile çakışmayı önlemek için)
                // Bu örnekte, 'touch-action: pan-y' CSS ile ayarlandı,
                // bu yüzden dikey kaydırma tarayıcı tarafından yönetilir.
                
                // Görevi tamamladıysa, sola kaydırmaya izin verme
                if (task.completed && diffX < 0) diffX = 0;
                // Görevi tamamlamadıysa, sağa kaydırmaya izin verme
                if (!task.completed && diffX > 0) diffX = 0;

                // Kaydırmayı sınırla (örn: 120px)
                if (Math.abs(diffX) > 120) {
                    diffX = diffX > 0 ? 120 : -120;
                }
                
                // İçeriği hareket ettir
                contentElement.style.transform = `translateX(${diffX}px)`;
            }

            async function onTouchEnd(e) {
                if (!isSwiping) return;
                isSwiping = false;

                const diffX = currentX - startX;
                
                // Animasyonu geri ekle
                contentElement.style.transition = 'transform 0.3s ease-out';
                
                if (!task.completed && diffX < -threshold) { // Sola kaydırma (Sil)
                    // Hareketi tamamla (görevi ekran dışına kaydır)
                    contentElement.style.transform = 'translateX(-100%)';
                    // Animasyon bittikten sonra sil
                    setTimeout(async () => {
                        await deleteTask(task.id);
                        // renderTasks() zaten onSnapshot tarafından tetiklenecek
                        // ama anında geri bildirim için elementi manuel de kaldırabiliriz
                        taskElement.remove();
                    }, 300);
                } else if (task.completed && diffX > threshold) { // Sağa kaydırma (Tamamla/Geri Al)
                    // Hareketi tamamla
                    contentElement.style.transform = 'translateX(100%)';
                    setTimeout(async () => {
                        await toggleTaskCompleted(task.id, task.completed);
                        // Geri kaydırmadan önce DOM'dan kaldır
                        taskElement.remove();
                    }, 300);
                } else {
                    // Eşiği geçmedi, geri çek
                    contentElement.style.transform = 'translateX(0px)';
                }
            }
            
            // Mouse olayları (masaüstü için - dokunmatik simülasyonu)
            // Gerçek bir mobil deneyim için bunlar atlanabilir,
            // ama test için kullanışlıdır.
            function onMouseDown(e) {
                e.preventDefault(); // Metin seçmeyi engelle
                startX = e.clientX;
                currentX = startX;
                isSwiping = true;
                contentElement.style.transition = 'none';
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            }
            
            function onMouseMove(e) {
                if (!isSwiping) return;
                currentX = e.clientX;
                let diffX = currentX - startX;
                
                if (task.completed && diffX < 0) diffX = 0;
                if (!task.completed && diffX > 0) diffX = 0;
                if (Math.abs(diffX) > 120) diffX = diffX > 0 ? 120 : -120;
                
                contentElement.style.transform = `translateX(${diffX}px)`;
            }
            
            async function onMouseUp(e) {
                if (!isSwiping) return;
                isSwiping = false;
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);

                // onTouchEnd ile aynı mantık
                const diffX = currentX - startX;
                contentElement.style.transition = 'transform 0.3s ease-out';
                
                if (!task.completed && diffX < -threshold) { // Sil
                    contentElement.style.transform = 'translateX(-100%)';
                    setTimeout(() => deleteTask(task.id), 300);
                } else if (task.completed && diffX > threshold) { // Tamamlandı Geri Al
                    contentElement.style.transform = 'translateX(100%)';
                    setTimeout(() => toggleTaskCompleted(task.id, task.completed), 300);
                } else {
                    contentElement.style.transform = 'translateX(0px)';
                }
            }

            // Dokunmatik olaylarını ekle
            contentElement.addEventListener('touchstart', onTouchStart, { passive: true });
            contentElement.addEventListener('touchmove', onTouchMove, { passive: true });
            contentElement.addEventListener('touchend', onTouchEnd);
            contentElement.addEventListener('touchcancel', onTouchEnd);
            
            // Masaüstü test için mouse olaylarını ekle
            contentElement.addEventListener('mousedown', onMouseDown);
        }

        // --- Veri Aktarımı (Export/Import) ---

        /**
         * Tüm görevleri bir JSON dosyası olarak indirir.
         */
        function exportData() {
            if (allTasks.length === 0) {
                showToast("Dışa aktarılacak görev yok.", 3000);
                return;
            }
            
            // Timestamp'leri okunabilir string'lere dönüştür
            const exportableData = allTasks.map(task => ({
                ...task,
                createdAt: task.createdAt ? task.createdAt.toDate().toISOString() : null,
                dueDate: task.dueDate ? task.dueDate.toDate().toISOString() : null,
            }));
            
            const dataStr = JSON.stringify(exportableData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `tasks-backup-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast("Veriler dışa aktarıldı!");
        }

        /**
         * JSON dosyasından verileri okur ve Firestore'a yazar (Batch).
         */
        async function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const importedTasks = JSON.parse(e.target.result);
                    if (!Array.isArray(importedTasks)) {
                        throw new Error("JSON dosyası bir dizi (array) değil.");
                    }

                    // Firestore'a toplu yazma (Batch Write)
                    const batch = writeBatch(db);
                    
                    importedTasks.forEach(task => {
                        // ID'leri kaldırarak Firestore'un yeni ID'ler oluşturmasını sağla
                        const { id, ...taskData } = task;

                        // Tarih string'lerini Timestamp'e geri dönüştür
                        const newTask = {
                            ...taskData,
                            createdAt: taskData.createdAt ? Timestamp.fromDate(new Date(taskData.createdAt)) : Timestamp.now(),
                            dueDate: taskData.dueDate ? Timestamp.fromDate(new Date(taskData.dueDate)) : null
                        };
                        
                        // Koleksiyona yeni bir belge referansı oluştur ve batch'e ekle
                        const newDocRef = doc(tasksCollection); // Otomatik ID oluşturur
                        batch.set(newDocRef, newTask);
                    });

                    await batch.commit();
                    showToast(`${importedTasks.length} görev başarıyla içe aktarıldı!`);
                    
                } catch (error) {
                    console.error("İçe aktarma hatası:", error);
                    showToast(`Hata: ${error.message}`, 5000);
                } finally {
                    // Input'u sıfırla ki aynı dosyayı tekrar seçebilsin
                    event.target.value = null;
                }
            };
            reader.readAsText(file);
        }


        // --- Olay Dinleyicileri (Event Listeners) ---

        function setupEventListeners() {
            // Görev Ekleme
            addTaskButton.addEventListener('click', addTaskToDb);
            taskInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    addTaskToDb();
                }
            });

            // Gelişmiş Seçenekler Paneli
            toggleAdvancedButton.addEventListener('click', toggleAdvancedOptions);

            // Akıllı Kategori
            magicCategoryButton.addEventListener('click', suggestCategory);

            // Arama
            searchBar.addEventListener('input', renderTasks);

            // Filtre Butonları
            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Aktif stili güncelle
                    filterButtons.forEach(btn => btn.classList.remove('bg-blue-500', 'text-white', 'dark:bg-blue-700'));
                    filterButtons.forEach(btn => btn.classList.add('bg-gray-200', 'text-gray-700', 'dark:bg-gray-600', 'dark:text-gray-200'));
                    button.classList.add('bg-blue-500', 'text-white', 'dark:bg-blue-700');
                    button.classList.remove('bg-gray-200', 'text-gray-700', 'dark:bg-gray-600', 'dark:text-gray-200');
                    
                    // Filtreyi ayarla ve yeniden çiz
                    currentFilter = button.dataset.filter;
                    renderTasks();
                });
            });

            // Düzenleme Modalı
            saveTaskButton.addEventListener('click', saveTaskChanges);
            cancelEditButton.addEventListener('click', closeEditModal);
            addSubtaskButton.addEventListener('click', addNewSubtaskToModal);
            newSubtaskInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault(); // Formu göndermeyi engelle
                    addNewSubtaskToModal();
                }
            });

            // Rapor Modalı
            reportButton.addEventListener('click', showReportModal);
            closeReportButton.addEventListener('click', () => reportModal.classList.add('hidden'));
            exportDataButton.addEventListener('click', exportData);
            importDataInput.addEventListener('change', importData);

            // Odaklanma Modalı
            focusButton.addEventListener('click', showFocusModal);
            closeFocusButton.addEventListener('click', () => focusModal.classList.add('hidden'));

            // Tema Değiştirme
            themeToggle.addEventListener('click', toggleTheme);
        }

        /**
         * Gelişmiş seçenekler panelini açar/kapar.
         */
        function toggleAdvancedOptions() {
            advancedOptions.classList.toggle('open');
            const icon = toggleAdvancedButton.querySelector('svg');
            if (advancedOptions.classList.contains('open')) {
                // Panel açıldı, ikonu 'X' yap
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />';
            } else {
                // Panel kapandı, ikonu '+' yap
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />';
            }
        }


        // --- Başlangıç ---
        
        // Sayfa yüklendiğinde
        document.addEventListener('DOMContentLoaded', () => {
            initializeFirebase();
            setupEventListeners();
            loadTheme();
            requestNotificationPermission(); // Bildirim izni iste
        });

    </script>
